name: Holding alerts

on:
  schedule:
    - cron: "45 9 * * 1-5" # 17:45 MYT, after the Bursa close
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holding-alerts
  cancel-in-progress: false

jobs:
  alerts:
    # Cron runs wait for the SCHEDULES_ENABLED repository variable; manual dispatch always runs.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.SCHEDULES_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --frozen --no-default-groups --extra pipeline
      - run: uv run --no-sync lens alerts run
