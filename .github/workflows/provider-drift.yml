name: Provider drift check

on:
  schedule:
    - cron: "0 2 * * 6" # Saturday 10:00 MYT
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live-providers:
    # Cron runs wait for the SCHEDULES_ENABLED repository variable; manual dispatch always runs.
    if: (github.event_name != 'schedule' || vars.SCHEDULES_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      LENS_RUN_NETWORK_TESTS: "1"
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --frozen --all-extras
      - run: uv run --no-sync pytest -m network --no-db -q
      - name: Open an issue on drift
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh issue create --title "Provider drift detected $(date +%F)"
          --body "A live provider check failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
