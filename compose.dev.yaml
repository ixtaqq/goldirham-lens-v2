name: goldirham-lens-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lens
      POSTGRES_USER: lens
      POSTGRES_PASSWORD: lens-local-only
    ports:
      - "127.0.0.1:${LENS_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lens -d lens"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - lens-postgres:/var/lib/postgresql/data

volumes:
  lens-postgres:
